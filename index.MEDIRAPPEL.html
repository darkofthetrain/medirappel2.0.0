<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MediRappel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF4F7; --surface:#FFFFFF; --ink:#12283A; --muted:#566A78; --line:#D3DFE6;
  --accent:#1B7F5A; --on-accent:#FFFFFF; --blue:#3B86AF;
  --warn:#8A5300; --warn-bg:#FBEFD5; --bad:#B3362E; --bad-bg:#F9E1DE; --foil:#DCEAF2;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A22; --surface:#16262F; --ink:#E8F0F2; --muted:#9DB0BB; --line:#2A3D48;
    --accent:#44B488; --on-accent:#06251C; --blue:#6FB1D6;
    --warn:#F0B44C; --warn-bg:#3A2C10; --bad:#F08A80; --bad-bg:#3B1B18; --foil:#1F3743;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A22; --surface:#16262F; --ink:#E8F0F2; --muted:#9DB0BB; --line:#2A3D48;
  --accent:#44B488; --on-accent:#06251C; --blue:#6FB1D6;
  --warn:#F0B44C; --warn-bg:#3A2C10; --bad:#F08A80; --bad-bg:#3B1B18; --foil:#1F3743;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
h1,h2{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0;line-height:1.15;letter-spacing:-0.01em}
h1{font-size:30px;font-weight:700}
h2{font-size:22px;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.brand{max-width:560px;margin:0 auto;padding:16px 16px 0;display:flex;align-items:center;gap:12px}
.brand img{width:48px;height:48px;border-radius:13px;background:#fff;border:1px solid var(--line);padding:3px;flex:none}
.wm{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;font-weight:700;font-size:26px;line-height:1.05;letter-spacing:-0.01em;display:block}
.wm b{color:var(--blue);font-weight:700}
.wm i{color:var(--accent);font-style:normal}
.brand small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 170px}
.sub{color:var(--muted);font-size:14px}
.top{margin-bottom:16px}
.top h1{margin-bottom:4px}

/* Plaquette du jour */
.strip{display:flex;flex-wrap:wrap;gap:10px;background:var(--foil);border-radius:999px;padding:12px 16px;margin-top:14px;min-height:44px;align-items:center}
.dot{width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:inset 0 1px 3px rgba(0,0,0,.28);display:inline-block}
.d-pris{background:var(--accent);box-shadow:none}
.d-saute{background:var(--line);box-shadow:none}
.d-retard,.d-manque{background:var(--surface);box-shadow:inset 0 0 0 3px var(--bad)}
.d-maintenant{background:var(--surface);box-shadow:inset 0 0 0 3px var(--accent)}

.banner{border-radius:14px;padding:12px 14px;margin:0 0 10px;font-size:15px}
.b-bad{background:var(--bad-bg);color:var(--bad)}
.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-info{background:var(--surface);border:1px solid var(--line)}
.banner .btn{margin-top:8px}

.dose{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 14px 10px 10px;margin-bottom:10px}
.pill{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;background:var(--surface);box-shadow:inset 0 2px 5px rgba(0,0,0,.25)}
.p-pris{background:var(--accent);color:var(--on-accent);box-shadow:none}
.p-saute{background:var(--line);color:var(--muted);box-shadow:none;font-size:22px}
.p-retard,.p-manque{box-shadow:inset 0 0 0 3px var(--bad);color:var(--bad)}
.p-maintenant{box-shadow:inset 0 0 0 3px var(--accent);color:var(--accent)}
.dose-main{display:flex;flex-direction:column;min-width:0}
.dose-main strong{font-size:17px;overflow-wrap:anywhere}
.tag{font-size:13px;font-weight:600;color:var(--muted);text-align:right}
.t-pris,.t-maintenant{color:var(--accent)}
.t-retard,.t-manque{color:var(--bad)}

.card{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px}
.med-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.med-h strong{font-size:18px}
.badge{align-self:flex-start;font-size:13px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--foil);color:var(--ink)}
.k-warn{background:var(--warn-bg);color:var(--warn)}
.k-bad{background:var(--bad-bg);color:var(--bad)}
.k-ok{background:var(--foil);color:var(--accent)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:22px 18px;text-align:center}
.empty p{margin:0 0 14px}
.empty .btn{margin:4px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 16px;font-weight:600;min-height:48px}
.btn-primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn-danger{color:var(--bad);border-color:var(--bad)}
.btn-block{display:block;width:100%;margin-top:10px}
.btn-x{border:0;background:transparent;font-size:22px;width:44px;height:44px;border-radius:50%;color:var(--muted)}

.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.nav button{background:transparent;border:0;border-top:3px solid transparent;padding:14px 4px 13px;font-weight:600;color:var(--muted)}
.nav button[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;padding:14px 20px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:5}

.toast{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 8px);max-width:536px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;z-index:30}
.toast button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:10px;padding:6px 12px}

.overlay{position:fixed;inset:0;background:rgba(5,15,22,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet:focus{outline:none}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}

label{display:block;font-size:14px;font-weight:600;margin-top:14px}
input,select,textarea{display:block;width:100%;margin-top:6px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-weight:400;font-size:16px}
textarea{min-height:90px;resize:vertical}
fieldset{border:1px solid var(--line);border-radius:14px;margin:14px 0 0;padding:0 12px 12px}
legend{font-size:14px;font-weight:600;padding:0 6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--bad);font-size:14px;min-height:20px;margin:10px 0 0}

.facts{margin:14px 0 0}
.facts dt{font-size:13px;color:var(--muted);margin-top:12px}
.facts dd{margin:2px 0 0}
.notice{white-space:pre-wrap;margin:2px 0 0}
.restock{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;margin-top:8px}
.restock label{margin-top:0}

.obs{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px}
.bar{height:12px;border-radius:999px;background:var(--foil);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--accent)}
.hrow{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hdots{display:flex;flex-wrap:wrap;gap:8px}
.hlist{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:4px 16px}
.hitem{padding:10px 0;border-bottom:1px solid var(--line)}
.hitem:last-child{border-bottom:0}
h2.sec{font-size:18px;margin:22px 0 10px}
.foot{margin-top:22px;text-align:center}
</style>
</head>

<main id="app" class="wrap"></main>
<button class="fab" data-a="add">+ Ajouter un médicament</button>
<nav class="nav" aria-label="Navigation principale">
  <button data-a="tab" data-tab="today">Aujourd’hui</button>
  <button data-a="tab" data-tab="meds">Médicaments</button>
  <button data-a="tab" data-tab="hist">Suivi</button>

<div id="sheet-root"></div>

<script>
(function(){
'use strict';

var KEY='assistant-ordonnance-v1';
var S={meds:[],log:[]};
var ui={tab:'today',sheet:null,toast:null};
var fired=new Set();

try{
  var raw=localStorage.getItem(KEY);
  if(raw){var o=JSON.parse(raw);S.meds=o.meds||[];S.log=o.log||[];}
}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ---------- utilitaires ---------- */
var $=function(s){return document.querySelector(s)};
var pad=function(n){return String(n).padStart(2,'0')};
var ymd=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var parse=function(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
var addDays=function(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
var tMin=function(t){var p=t.split(':').map(Number);return p[0]*60+p[1]};
var nowMin=function(){var d=new Date();return d.getHours()*60+d.getMinutes()};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
var pl=function(n,w){return n+' '+w+(n>1?'s':'')};
var cap=function(s){return s.charAt(0).toUpperCase()+s.slice(1)};
var hhmm=function(iso){var d=new Date(iso);return pad(d.getHours())+':'+pad(d.getMinutes())};
var longDate=function(s){return parse(s).toLocaleDateString('fr-FR',{day:'numeric',month:'long'})};

var CHECK='<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
var DEF={1:['08:00'],2:['08:00','20:00'],3:['08:00','14:00','20:00'],4:['06:00','12:00','18:00','22:00']};

/* ---------- logique métier ---------- */
function endDate(m){return m.duree>0?addDays(m.start,m.duree):null}
function active(m,d){return d>=m.start&&(!m.duree||d<endDate(m))}
function perDay(m){return m.times.length*(m.qte||1)}

function dosesFor(d){
  var out=[];
  S.meds.forEach(function(m){
    if(!active(m,d))return;
    m.times.forEach(function(t){
      if(d===m.start&&m.fromMin!=null&&tMin(t)<m.fromMin)return;
      var e=S.log.find(function(l){return l.medId===m.id&&l.date===d&&l.time===t});
      out.push({m:m,t:t,d:d,e:e});
    });
  });
  out.sort(function(a,b){return tMin(a.t)-tMin(b.t)||a.m.nom.localeCompare(b.m.nom)});
  return out;
}
function status(x){
  if(x.e)return x.e.status;
  var T=ymd(new Date());
  if(x.d<T)return 'manque';
  if(x.d>T)return 'avenir';
  var diff=nowMin()-tMin(x.t);
  if(diff>=30)return 'retard';
  if(diff>=0)return 'maintenant';
  return 'avenir';
}
function label(x,s){
  return {pris:'Pris à '+(x.e?hhmm(x.e.at):''),saute:'Sautée',retard:'En retard',maintenant:'Maintenant',avenir:'À venir',manque:'Manquée'}[s];
}
function stockInfo(m){
  var T=ymd(new Date());
  if(m.duree>0&&T>=endDate(m))return {k:'fin',t:'Traitement terminé'};
  if(m.stock<=0)return {k:'bad',t:'Stock épuisé'};
  if(m.stock<perDay(m)*2)return {k:'warn',t:'Stock bas : '+pl(m.stock,'restant')+' (moins de 2 jours)'};
  return {k:'ok',t:m.stock+' en stock, environ '+pl(Math.floor(m.stock/perDay(m)),'jour')};
}
function findDose(s){return dosesFor(s.date).find(function(z){return z.m.id===s.med&&z.t===s.time})}
function take(x){
  S.log.push({id:uid(),medId:x.m.id,date:x.d,time:x.t,status:'pris',at:new Date().toISOString()});
  x.m.stock=Math.max(0,x.m.stock-(x.m.qte||1));save();
}
function skip(x){
  S.log.push({id:uid(),medId:x.m.id,date:x.d,time:x.t,status:'saute',at:new Date().toISOString()});save();
}
function undo(x){
  S.log=S.log.filter(function(l){return l!==x.e});
  if(x.e.status==='pris')x.m.stock+=(x.m.qte||1);
  save();
}

/* ---------- vues ---------- */
function viewToday(){
  var T=ymd(new Date());
  var ds=dosesFor(T);
  var done=ds.filter(function(x){return x.e&&x.e.status==='pris'}).length;
  var late=ds.filter(function(x){return status(x)==='retard'});
  var low=S.meds.filter(function(m){var k=stockInfo(m).k;return k==='warn'||k==='bad'});
  var title=cap(new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}));
  var h='<header class="top"><h1>'+esc(title)+'</h1>';
  if(ds.length){
    h+='<div class="sub">'+done+' prise'+(done>1?'s':'')+' sur '+ds.length+' aujourd’hui</div>';
    h+='<div class="strip" aria-hidden="true">'+ds.map(function(x){return '<span class="dot d-'+status(x)+'"></span>'}).join('')+'</div>';
  }
  h+='</header>';

  if(late.length){
    h+='<div class="banner b-bad" role="status">'+pl(late.length,'prise')+' en retard : '+late.map(function(x){return esc(x.m.nom)+' ('+x.t+')'}).join(', ')+'</div>';
  }
  if(low.length){
    h+='<div class="banner b-warn" role="status">Stock à renouveler : '+low.map(function(m){return esc(m.nom)+' ('+m.stock+')'}).join(', ')+'</div>';
  }
  if(S.meds.length&&'Notification' in window&&Notification.permission==='default'){
    h+='<div class="banner b-info">Recevez une notification à l’heure de chaque prise. Les rappels fonctionnent quand l’application est ouverte.<br><button class="btn" data-a="notif">Activer les notifications</button></div>';
  }

  if(!S.meds.length){
    h+='<div class="empty"><p>Aucun médicament pour l’instant. Ajoutez celui de votre ordonnance pour recevoir des rappels et suivre vos prises.</p><button class="btn btn-primary" data-a="add">Ajouter un médicament</button><button class="btn" data-a="example">Voir un exemple</button></div>';
  }else if(!ds.length){
    h+='<div class="empty"><p>Aucune prise prévue aujourd’hui.</p></div>';
  }else{
    h+=ds.map(function(x){
      var s=status(x);
      var q=x.m.qte>1?' · '+x.m.qte+' comprimés':'';
      return '<button class="dose" data-a="dose" data-med="'+x.m.id+'" data-date="'+x.d+'" data-time="'+x.t+'">'
        +'<span class="pill p-'+s+'">'+(s==='pris'?CHECK:(s==='saute'?'–':x.t))+'</span>'
        +'<span class="dose-main"><strong>'+esc(x.m.nom)+'</strong><span class="sub">'+x.t+(x.m.dosage?' · '+esc(x.m.dosage):'')+q+'</span></span>'
        +'<span class="tag t-'+s+'">'+label(x,s)+'</span></button>';
    }).join('');
  }
  return h;
}

function viewMeds(){
  var h='<header class="top"><h1>Mes médicaments</h1></header>';
  if(!S.meds.length){
    return h+'<div class="empty"><p>Vous n’avez pas encore ajouté de médicament.</p><button class="btn btn-primary" data-a="add">Ajouter un médicament</button><button class="btn" data-a="example">Voir un exemple</button></div>';
  }
  var meds=S.meds.slice().sort(function(a,b){return a.nom.localeCompare(b.nom)});
  h+=meds.map(function(m){
    var si=stockInfo(m);
    return '<button class="card" data-a="med" data-med="'+m.id+'">'
      +'<span class="med-h"><strong>'+esc(m.nom)+'</strong><span class="sub">'+esc(m.dosage)+'</span></span>'
      +'<span class="sub">'+pl(m.times.length,'prise')+' par jour · '+m.times.join(', ')+'</span>'
      +(m.ord?'<span class="sub">Ordonnance : '+esc(m.ord)+'</span>':'')
      +'<span class="badge k-'+si.k+'">'+si.t+'</span></button>';
  }).join('');
  return h;
}

function viewHist(){
  var T=ymd(new Date());
  var due=0,taken=0,rows=[];
  for(var i=0;i<7;i++){
    var d=addDays(T,-i);
    var ds=dosesFor(d);
    ds.forEach(function(x){
      var s=status(x);
      if(s==='pris'){due++;taken++}
      else if(s==='saute'||s==='manque'||s==='retard'){due++}
    });
    rows.push({d:d,ds:ds,i:i});
  }
  var pct=due?Math.round(taken/due*100):null;
  var h='<header class="top"><h1>Suivi</h1><div class="sub">7 derniers jours</div></header>';
  if(!S.meds.length){
    return h+'<div class="empty"><p>Le suivi apparaît dès que vous ajoutez un médicament.</p><button class="btn btn-primary" data-a="add">Ajouter un médicament</button></div>';
  }
  h+='<div class="obs">';
  if(pct===null){h+='<p style="margin:0">Pas encore de prise à évaluer.</p>'}
  else{
    h+='<p style="margin:0"><strong>'+pl(taken,'prise')+'</strong> sur '+due+' prévues ont été prises ('+pct+' %).</p>'
      +'<div class="bar" role="img" aria-label="Observance '+pct+' pour cent"><i style="width:'+pct+'%"></i></div>';
  }
  h+='</div>';
  h+=rows.map(function(r){
    var lbl=r.i===0?'Aujourd’hui':(r.i===1?'Hier':cap(parse(r.d).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric'})));
    var dots=r.ds.length?r.ds.map(function(x){return '<span class="dot d-'+status(x)+'" title="'+esc(x.m.nom)+' '+x.t+'"></span>'}).join(''):'<span class="sub">Aucune prise</span>';
    return '<div class="hrow"><span>'+esc(lbl)+'</span><span class="hdots">'+dots+'</span></div>';
  }).join('');

  var recent=S.log.filter(function(l){return S.meds.some(function(m){return m.id===l.medId})})
    .slice().sort(function(a,b){return b.at.localeCompare(a.at)}).slice(0,12);
  if(recent.length){
    h+='<h2 class="sec">Dernières actions</h2><div class="hlist">'+recent.map(function(l){
      var m=S.meds.find(function(z){return z.id===l.medId});
      return '<div class="hitem"><strong>'+esc(m.nom)+'</strong><div class="sub">'+longDate(l.date)+' · prise de '+l.time+' · '+(l.status==='pris'?'prise à '+hhmm(l.at):'sautée')+'</div></div>';
    }).join('')+'</div>';
  }
  return h;
}

function render(){
  var v=ui.tab==='meds'?viewMeds():(ui.tab==='hist'?viewHist():viewToday());
  $('#app').innerHTML=v;
  document.querySelectorAll('.nav button').forEach(function(b){
    if(b.dataset.tab===ui.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
  });
  $('#toast-root').innerHTML=ui.toast?'<div class="toast" role="status"><span>'+esc(ui.toast)+'</span><button data-a="toast-close">OK</button></div>':'';
}

/* ---------- feuilles (dialogues) ---------- */
function sheetDose(s){
  var x=findDose(s);
  if(!x)return '';
  var st=status(x);
  var h='<div class="sh-head"><h2>'+esc(x.m.nom)+'</h2><button class="btn-x" data-a="close" aria-label="Fermer">✕</button></div>'
    +'<p class="sub" style="margin:0">Prise de '+x.t+(x.m.dosage?' · '+esc(x.m.dosage):'')+'</p>';
  if(x.e){
    h+='<p>'+(x.e.status==='pris'?'Prise enregistrée à '+hhmm(x.e.at)+'.':'Prise sautée.')+'</p>'
      +'<button class="btn btn-block" data-a="undo">Annuler cette action</button>';
  }else{
    h+='<p>'+(st==='retard'?'Cette prise est en retard.':'Avez-vous pris ce médicament ?')+'</p>'
      +'<button class="btn btn-primary btn-block" data-a="take">Prise effectuée</button>'
      +'<button class="btn btn-block" data-a="skip">Sauter cette prise</button>';
  }
  h+='<button class="btn btn-block" data-a="med" data-med="'+x.m.id+'">Voir la notice et le stock</button>';
  return h;
}

function sheetMed(s){
  var m=S.meds.find(function(z){return z.id===s.id});
  if(!m)return '';
  var si=stockInfo(m),end=endDate(m);
  var h='<div class="sh-head"><h2>'+esc(m.nom)+'</h2><button class="btn-x" data-a="close" aria-label="Fermer">✕</button></div>'
    +'<p class="sub" style="margin:0">'+esc(m.dosage)+'</p>'
    +'<dl class="facts">'
    +'<dt>Horaires</dt><dd>'+m.times.join(', ')+' ('+pl(m.qte||1,'comprimé')+' par prise)</dd>'
    +'<dt>Durée</dt><dd>'+(m.duree>0?pl(m.duree,'jour')+', jusqu’au '+longDate(addDays(end,-1)):'Traitement continu')+'</dd>'
    +(m.ord?'<dt>Ordonnance</dt><dd>'+esc(m.ord)+'</dd>':'')
    +'<dt>Stock</dt><dd><span class="badge k-'+si.k+'">'+si.t+'</span></dd>'
    +'<dt>Notice et conseils</dt><dd class="notice">'+(m.notice?esc(m.notice):'Aucune notice saisie.')+'</dd>'
    +'</dl>'
    +'<div class="restock"><label>Ajouter au stock<input id="r-qty" type="number" inputmode="numeric" min="1" value="10"></label>'
    +'<button class="btn" data-a="restock" data-med="'+m.id+'">Ajouter</button></div>'
    +'<button class="btn btn-block" data-a="edit" data-med="'+m.id+'">Modifier</button>';
  if(s.confirm){
    h+='<button class="btn btn-danger btn-block" data-a="del-ok" data-med="'+m.id+'">Confirmer la suppression</button>';
  }else{
    h+='<button class="btn btn-danger btn-block" data-a="del-ask">Supprimer ce médicament</button>';
  }
  return h;
}

function timesHTML(times){
  return times.map(function(t,i){
    return '<label>Prise '+(i+1)+'<input type="time" class="f-time" value="'+t+'"></label>';
  }).join('');
}
function sheetForm(s){
  var m=s.id?S.meds.find(function(z){return z.id===s.id}):null;
  var v=m||{nom:'',dosage:'',qte:1,times:DEF[2],duree:'',stock:'',ord:'',notice:''};
  var opts=[1,2,3,4].map(function(n){return '<option value="'+n+'"'+(v.times.length===n?' selected':'')+'>'+n+'</option>'}).join('');
  return '<div class="sh-head"><h2>'+(m?'Modifier le médicament':'Nouveau médicament')+'</h2><button class="btn-x" data-a="close" aria-label="Fermer">✕</button></div>'
    +'<p class="sub" style="margin:0">Recopiez les informations de votre ordonnance.</p>'
    +'<label>Nom du médicament<input id="f-nom" value="'+esc(v.nom)+'" autocomplete="off" placeholder="Ex. Amoxicilline"></label>'
    +'<label>Dosage<input id="f-dosage" value="'+esc(v.dosage)+'" autocomplete="off" placeholder="Ex. 500 mg"></label>'
    +'<div class="row2"><label>Comprimés par prise<input id="f-qte" type="number" inputmode="numeric" min="1" value="'+(v.qte||1)+'"></label>'
    +'<label>Prises par jour<select id="f-prises">'+opts+'</select></label></div>'
    +'<fieldset><legend>Heures de prise</legend><div id="f-times">'+timesHTML(v.times)+'</div></fieldset>'
    +'<div class="row2"><label>Durée en jours<input id="f-duree" type="number" inputmode="numeric" min="0" value="'+(v.duree||'')+'" placeholder="Vide = continu"></label>'
    +'<label>Stock (comprimés)<input id="f-stock" type="number" inputmode="numeric" min="0" value="'+(v.stock===''?'':v.stock)+'"></label></div>'
    +'<label>Ordonnance (facultatif)<input id="f-ord" value="'+esc(v.ord||'')+'" autocomplete="off" placeholder="Ex. Dr Koné, 12 septembre"></label>'
    +'<label>Notice et conseils<textarea id="f-notice" placeholder="Ex. À prendre pendant les repas.">'+esc(v.notice||'')+'</textarea></label>'
    +'<p class="err" id="f-err" role="alert"></p>'
    +'<button class="btn btn-primary btn-block" data-a="save"'+(m?' data-med="'+m.id+'"':'')+'>Enregistrer</button>'
    +'<button class="btn btn-block" data-a="close">Annuler</button>';
}
function bindForm(){
  var sel=$('#f-prises');
  sel.addEventListener('change',function(){
    var n=parseInt(sel.value,10);
    var cur=[].slice.call(document.querySelectorAll('.f-time')).map(function(i){return i.value});
    $('#f-times').innerHTML=timesHTML(DEF[n].map(function(d,i){return cur[i]||d}));
  });
}
function saveForm(id){
  var err=function(t){$('#f-err').textContent=t};
  var nom=$('#f-nom').value.trim();
  if(!nom){err('Indiquez le nom du médicament.');$('#f-nom').focus();return}
  var times=[].slice.call(document.querySelectorAll('.f-time')).map(function(i){return i.value});
  if(times.some(function(t){return !t})){err('Indiquez l’heure de chaque prise.');return}
  if(new Set(times).size!==times.length){err('Deux prises ont la même heure.');return}
  times.sort(function(a,b){return tMin(a)-tMin(b)});
  var stockRaw=$('#f-stock').value;
  if(stockRaw===''){err('Indiquez le nombre de comprimés en stock.');$('#f-stock').focus();return}
  var data={
    nom:nom,
    dosage:$('#f-dosage').value.trim(),
    qte:Math.max(1,parseInt($('#f-qte').value,10)||1),
    times:times,
    duree:Math.max(0,parseInt($('#f-duree').value,10)||0),
    stock:Math.max(0,parseInt(stockRaw,10)||0),
    ord:$('#f-ord').value.trim(),
    notice:$('#f-notice').value.trim()
  };
  if(id){
    var m=S.meds.find(function(z){return z.id===id});
    if(m)Object.assign(m,data);
  }else{
    data.id=uid();data.start=ymd(new Date());data.fromMin=nowMin();
    S.meds.push(data);
  }
  save();
  closeSheet();
}

function renderSheet(){
  var r=$('#sheet-root'),s=ui.sheet;
  if(!s){r.innerHTML='';return}
  var inner=s.t==='dose'?sheetDose(s):(s.t==='med'?sheetMed(s):sheetForm(s));
  if(!inner){closeSheet();return}
  r.innerHTML='<div class="overlay"><div class="sheet" role="dialog" aria-modal="true" tabindex="-1">'+inner+'</div></div>';
  r.querySelector('.sheet').focus();
  if(s.t==='form')bindForm();
}
function closeSheet(){ui.sheet=null;renderSheet();render()}

function loadExample(){
  var T=ymd(new Date());
  S.meds.push({id:uid(),nom:'Amoxicilline',dosage:'500 mg',qte:1,times:['08:00','14:00','20:00'],duree:7,stock:21,ord:'Exemple d’ordonnance',
    notice:'À prendre pendant les repas avec un verre d’eau.\nTerminer le traitement même si vous vous sentez mieux.',start:T,fromMin:null});
  S.meds.push({id:uid(),nom:'Paracétamol',dosage:'1000 mg',qte:1,times:['08:00','20:00'],duree:5,stock:3,ord:'Exemple d’ordonnance',
    notice:'Ne pas dépasser la dose indiquée sur l’ordonnance.\nEn cas de doute, demandez conseil à votre pharmacien.',start:T,fromMin:null});
  save();render();
}

/* ---------- rappels ---------- */
function ping(x){
  ui.toast='C’est l’heure : '+x.m.nom+(x.m.dosage?' ('+x.m.dosage+')':'');
  try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}
  try{
    if('Notification' in window&&Notification.permission==='granted'){
      new Notification('MediRappel',{body:'C’est l’heure de prendre '+x.m.nom+'.'});
    }
  }catch(e){}
  render();
}
function tick(){
  var T=ymd(new Date()),n=nowMin();
  dosesFor(T).forEach(function(x){
    if(x.e||tMin(x.t)!==n)return;
    var k=T+x.m.id+x.t;
    if(fired.has(k))return;
    fired.add(k);ping(x);
  });
  if(!ui.sheet)render();
}

/* ---------- événements ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');
  if(!b){
    if(e.target.classList&&e.target.classList.contains('overlay'))closeSheet();
    return;
  }
  var a=b.dataset.a,x;
  if(a==='tab'){ui.tab=b.dataset.tab;render();window.scrollTo(0,0)}
  else if(a==='add'){ui.sheet={t:'form',id:null};renderSheet()}
  else if(a==='edit'){ui.sheet={t:'form',id:b.dataset.med};renderSheet()}
  else if(a==='med'){ui.sheet={t:'med',id:b.dataset.med};renderSheet()}
  else if(a==='dose'){ui.sheet={t:'dose',med:b.dataset.med,date:b.dataset.date,time:b.dataset.time};renderSheet()}
  else if(a==='close'){closeSheet()}
  else if(a==='take'||a==='skip'||a==='undo'){
    x=findDose(ui.sheet);
    if(x){if(a==='take')take(x);else if(a==='skip')skip(x);else undo(x)}
    closeSheet();
  }
  else if(a==='save'){saveForm(b.dataset.med||null)}
  else if(a==='del-ask'){ui.sheet.confirm=true;renderSheet()}
  else if(a==='del-ok'){
    var id=b.dataset.med;
    S.meds=S.meds.filter(function(m){return m.id!==id});
    S.log=S.log.filter(function(l){return l.medId!==id});
    save();closeSheet();
  }
  else if(a==='restock'){
    var q=parseInt($('#r-qty').value,10)||0;
    var m=S.meds.find(function(z){return z.id===b.dataset.med});
    if(m&&q>0){m.stock+=q;save();renderSheet();render()}
  }
  else if(a==='example'){loadExample()}
  else if(a==='notif'){
    try{Notification.requestPermission().then(render)}catch(err){render()}
  }
  else if(a==='toast-close'){ui.toast=null;render()}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ui.sheet)closeSheet()});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&!ui.sheet)render()});

render();
tick();
setInterval(tick,20000);
})();
</script>
</body>
</html>
